apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

# Pin to a specific image digest in production; use :latest for homelab convenience
images:
  - name: ghcr.io/YOUR_ORG/kaiserclaim
    newTag: latest

# Homelab: single replica is fine; bump if you ever split ÖGK and Merkur workers
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: kaiserclaim-worker
