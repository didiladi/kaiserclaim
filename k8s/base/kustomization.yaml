apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kaiserclaim

resources:
  - namespace.yaml
  # secret.yaml is NOT included — apply the real secret once with:
  #   kubectl create secret generic kaiserclaim-secrets --from-env-file=.env \
  #     -n kaiserclaim --dry-run=client -o yaml | kubectl apply -f -
  - pvc.yaml
  - redis.yaml
  - migrate-job.yaml
  - api-deployment.yaml
  - worker-deployment.yaml
  - beat-deployment.yaml
  - certificate.yaml
  - ingress.yaml
