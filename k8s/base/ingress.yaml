# Traefik IngressRoute — exposes the app on kaiserclaim.home (via PiHole DNS)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kaiserclaim-ingress
  namespace: kaiserclaim
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kaiserclaim.home`)
      kind: Rule
      services:
        - name: kaiserclaim-api-svc
          port: 80
