# Traefik IngressRoute (k3s default ingress controller).
# Exposes the API on kaiserclaim.local — add this to your LAN DNS / /etc/hosts.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kaiserclaim-ingress
  namespace: kaiserclaim
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`kaiserclaim.local`)
      kind: Rule
      services:
        - name: kaiserclaim-api-svc
          port: 80
