# NAS storage for invoice files and the ÖGK persistent browser session.
# Adjust storageClassName to match your k3s NFS/SMB provisioner.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kaiserclaim-storage
  namespace: kaiserclaim
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
