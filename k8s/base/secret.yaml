# DO NOT commit real values — this is a template.
# In your homelab, apply the real secret with:
#   kubectl create secret generic kaiserclaim-secrets \
#     --from-env-file=.env \
#     -n kaiserclaim \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: kaiserclaim-secrets
  namespace: kaiserclaim
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://kaiserclaim:CHANGE_ME@postgres-svc:5432/kaiserclaim"
  REDIS_URL: "redis://redis-svc:6379/0"
  CELERY_BROKER_URL: "redis://redis-svc:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-svc:6379/1"
  GEMINI_API_KEY: "CHANGE_ME"
  SECRET_KEY: "CHANGE_ME"
  MERKUR_USERNAME: "CHANGE_ME"
  MERKUR_PASSWORD: "CHANGE_ME"
  STORAGE_ROOT: "/mnt/nas"
