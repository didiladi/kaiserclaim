apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaiserclaim-beat
  namespace: kaiserclaim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaiserclaim-beat
  template:
    metadata:
      labels:
        app: kaiserclaim-beat
    spec:
      containers:
        - name: beat
          image: ghcr.io/didiladi/kaiserclaim:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - workers.tasks.celery_app
            - beat
            - --loglevel=info
          envFrom:
            - secretRef:
                name: kaiserclaim-secrets
          volumeMounts:
            - name: storage
              mountPath: /mnt/nas
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: kaiserclaim-storage
