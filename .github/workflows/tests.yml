name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # tests/conftest.py imports the whole app, so the app requirements are needed
      # even for the parser tests that touch no database.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run parser unit tests
        run: pytest tests/test_regex_parser.py tests/test_rksv_parser.py tests/test_oegk_result_parser.py -v
