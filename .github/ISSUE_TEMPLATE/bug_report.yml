name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - OCR engine
        - Merkur bot (Playwright)
        - ÖGK bot (Playwright)
        - Gemini contract parser
        - API endpoint
        - Celery worker / task
        - Database / migration
        - Docker / k3s deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. POST /api/v1/invoices/ with ...
        2. Check Celery logs ...
        3. See error ...

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste logs here. Remove any personal data before posting.
      render: shell

  - type: input
    id: version
    attributes:
      label: Commit SHA or image tag
